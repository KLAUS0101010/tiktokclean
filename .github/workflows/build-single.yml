name: Build TikTok Clean
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to the official TikTok .apk (see INSTRUCTION-RU.md, step 2)"
        required: true
      region:
        description: "Country at the first start (can be changed later in the mod menu inside TikTok, any country)"
        required: true
        type: choice
        default: NL
        options: [NL, RU, DE, BY, KZ, US, TR, PL, GB, FR, AE]
      server_url:
        description: "Address of your Cloudflare server for notes and updates (INSTRUCTION-RU.md, part 3). Can stay empty."
        required: false
        default: ""
      change_system_region:
        description: "Also change the country part of the system locale (language stays)"
        required: true
        type: boolean
        default: true
      remove_ads:
        description: "Remove advertising videos from the feed"
        required: true
        type: boolean
        default: true
      publish:
        description: "Also publish the result as a public Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

