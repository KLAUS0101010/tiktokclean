      - name: Tests
        run: |
          python3 -I tests/test_patch.py
          python3 -I tests/test_dex_api.py
          mkdir -p out && javac -nowarn -d out hooks/Region.java hooks/Json.java hooks/LinkCleaner.java hooks/AdFilter.java hooks/VideoInfo.java hooks/ServerAddress.java tests/*.java
          java -cp out dev.clean.RegionTest
          java -cp out dev.clean.LinkCleanerTest
          java -cp out dev.clean.AdFilterTest
          java -cp out dev.clean.VideoInfoTest
          java -cp out dev.clean.ServerAddressTest
          (cd server && node worker.test.mjs)
          python3 -I tests/make_stubs.py stubsrc && mkdir -p stubout && javac -nowarn -d stubout $(find stubsrc -name '*.java')
          sed 's/__REGION__/NL/;s/__LOCALE__/true/;s/__BUILD__/1/;s|__SERVER__|https://x.dev|' hooks/Config.java.in > hooks/Config.java.tmp && mkdir -p chk && cp hooks/Config.java.tmp chk/Config.java && rm hooks/Config.java.tmp
          javac -nowarn -cp stubout -d chk2 chk/Config.java hooks/*.java

      - name: Download TikTok
        env: { APK_URL: "${{ inputs.apk_url }}" }
        run: |
          curl -L --fail --retry 3 -o tiktok.apk "$APK_URL"
          ls -la tiktok.apk
          unzip -l tiktok.apk | grep -q "AndroidManifest.xml" || { echo "This is not an .apk file (maybe a bundle .xapk/.apks/.apkm or a web page)."; exit 1; }
          unzip -l tiktok.apk | grep -q "classes.dex" || { echo "No classes.dex inside: not a normal universal apk."; exit 1; }

      - name: Get apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Unpack (code only; resources stay exactly as they are)
        run: |
          java -Xmx5g -jar apktool.jar d -r -f -o dec tiktok.apk
          # apktool picks too low a "api level" for the code after -r; this raises it to what the dex files need
          python3 -I dex_api.py tiktok.apk dec

      - name: Report (what is inside the original TikTok)
        run: |
          python3 -I analyze_apk.py dec > report.txt
          { echo '```'; head -c 60000 report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt

      - name: Build our own small dex (the hooks)
        env:
          REGION: ${{ inputs.region }}
          LOCALE: ${{ inputs.change_system_region }}
          SERVER: ${{ inputs.server_url }}
          BUILD: ${{ github.run_number }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          mkdir -p build/src build/classes build/dex
          python3 -I - <<'PY'
          import os
          t = open("hooks/Config.java.in").read()
          for k in ("REGION", "LOCALE", "BUILD", "SERVER"):
              t = t.replace("__%s__" % k, os.environ.get(k, "").strip())
          open("build/src/Config.java", "w").write(t)
          PY
          cp hooks/*.java build/src/
          # compile-check against the real Android library; fails the build here (not on your phone) if something is wrong
          javac --release 8 -cp "$PLAT/android.jar" -d build/classes build/src/*.java
          "$BT/d8" --release --min-api 21 --lib "$PLAT/android.jar" --output build/dex $(find build/classes -name '*.class')
          ls -la build/dex

      - name: Patch
        env: { ADS: "${{ inputs.remove_ads }}" }
        run: |
          FLAG=""; [ "$ADS" = "false" ] && FLAG="--no-ads"
          python3 -I patch_tiktok.py dec $FLAG 2>&1 | tee patch-log.txt

      - name: Repack
        env: { ADS: "${{ inputs.remove_ads }}" }
        run: |
          if java -Xmx5g -jar apktool.jar b -o unsigned.apk dec > repack-log.txt 2>&1; then
            tail -n 3 repack-log.txt
          else
            echo "::warning::Repack failed. Last lines of the error:"
            grep -v "^I:" repack-log.txt | tail -n 25
            echo "Retrying without the experimental hooks (flag readers, early start)"
            rm -rf dec
            java -Xmx5g -jar apktool.jar d -r -f -o dec tiktok.apk
            python3 -I dex_api.py tiktok.apk dec
            FLAG="--safe"; [ "$ADS" = "false" ] && FLAG="--safe --no-ads"
            python3 -I patch_tiktok.py dec $FLAG 2>&1 | tee patch-log.txt
            java -Xmx5g -jar apktool.jar b -o unsigned.apk dec
          fi

      - name: Add our dex to the apk
        run: |
          N=$(unzip -Z1 unsigned.apk | grep -cE '^classes[0-9]*\.dex$')
          NAME="classes$((N+1)).dex"
          cp build/dex/classes.dex "$NAME"
          zip -q unsigned.apk "$NAME"
          echo "added $NAME (apk had $N dex files)"

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: tiktokclean.jks
          key: tiktokclean-signing-key-v1

      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ ! -f tiktokclean.jks ]; then
            keytool -genkeypair -keystore tiktokclean.jks -storepass tiktokclean -keypass tiktokclean \
              -alias tiktokclean -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TikTok Clean"
          fi
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks tiktokclean.jks --ks-pass pass:tiktokclean --key-pass pass:tiktokclean \
            --out TikTok-Clean.apk aligned.apk
          "$BT/apksigner" verify --verbose TikTok-Clean.apk | head -5
          ls -la TikTok-Clean.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-Clean
          path: TikTok-Clean.apk

      - name: Publish release (optional)
        if: ${{ inputs.publish }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create -R "${{ github.repository }}" "tiktok-clean-${{ github.run_number }}" TikTok-Clean.apk --title "TikTok Clean build ${{ github.run_number }}" --notes "Official TikTok with the chosen region and third-party trackers removed. Built from the official apk by patch_tiktok.py."
